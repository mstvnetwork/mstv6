<!DOCTYPE html>
<html>
<head>
    <title>Stream Test</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
        video { width: 80%; border: 2px solid #333; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Netlify Edge Proxy Test</h1>
    <video id="video" controls autoplay muted></video>
    <p id="status">Loading...</p>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        
        // TEST URL: A public HLS stream
        const testStream = "https://test-streams.mux.dev";
        const proxyUrl = "/proxy-stream/?url=" + encodeURIComponent(testStream);

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(proxyUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                status.innerText = "Proxy working! Stream playing.";
                status.style.color = "lime";
            });
        } else {
            status.innerText = "HLS not supported in this browser.";
        }
    </script>
</body>
</html>
