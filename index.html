<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeeTV HD - Live Bypass</title>
    <!-- Stable Shaka Player UI via cdnjs -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com" crossorigin="anonymous">
    <script src="https://cdnjs.cloudflare.com" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: monospace; }
        .container { width: 95%; max-width: 800px; border: 1px solid #333; }
        video { width: 100%; height: auto; display: block; }
        #status { margin-top: 15px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<div class="container" data-shaka-player-container>
    <video id="video" data-shaka-player-video autoplay style="width:100%;height:100%"></video>
</div>
<div id="status">INITIALISING ZEETV DECRYPTION...</div>

<script>
// Data Sniffed from DevTools [Source: Cloudfront/ZeeTV]
const rawManifest = 'https://d1g8wgjurz8via.cloudfront.net';
const proxy = 'https://api.allorigins.win';
const manifestUri = proxy + encodeURIComponent(rawManifest);

const kid = 'ed068cf84f0640ccbc7c0e395c0a272e';
const key = 'bb722190f2bb446391020411a7d0828b';

async function init() {
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    
    // Polyfills for browser compatibility [Source: Shaka Docs]
    shaka.polyfill.installAll();

    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    // DRM Configuration using ClearKey [Source: DevTools Sniff]
    player.configure({
        drm: {
            clearKeys: {
                [kid]: key
            }
        }
    });

    player.addEventListener('error', (event) => {
        status.innerText = "PLAYER ERROR: " + event.detail.code;
        status.style.color = "red";
    });

    try {
        await player.load(manifestUri);
        status.innerText = "STREAMING: ZEE TV HD";
        status.style.color = "#00ff00";
    } catch (e) {
        status.innerText = "LOAD FAILED (ISP BLOCK OR EXPIRED TOKEN)";
        console.error('Error Code:', e.code);
    }
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
