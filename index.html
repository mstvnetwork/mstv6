<!DOCTYPE html>
<html>
<head>
    <title>Channel Selector</title>
    <style>
        .channel-btn { padding: 10px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Select a Channel to Watch</h2>
    <!-- Example Channel Buttons -->
    <button class="channel-btn" onclick="openPlayer('https://example.com/stream1.mpd', 'key_id_1', 'key_1')">Channel 1 (Encrypted)</button>
    <button class="channel-btn" onclick="openPlayer('https://example.com/stream2.mpd', 'key_id_2', 'key_2')">Channel 2 (Encrypted)</button>

    <script>
        function openPlayer(url, keyId, key) {
            // Encode parameters to pass via URL
            const params = `?url=${encodeURIComponent(url)}&keyId=${keyId}&key=${key}`;
            
            // Define window features (size, location, etc.)
            const features = 'width=800,height=500,menubar=no,toolbar=no,location=no,status=no,resizable=yes';
            
            // Open 'player.html' in a new window with the parameters
            window.open('player.html' + params, 'ShakaPlayerWindow', features);
        }
    </script>
</body>
</html>
