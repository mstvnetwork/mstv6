<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Overlay Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      height: 100%;
      overflow: hidden;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      height: 100vh;
      background: black;
    }

    iframe#videoFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      pointer-events: none; /* Prevent clicking/interaction */
    }

    #muteButton {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      font-size: 1.5em;
      padding: 8px;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    #scrollBanner {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #007BFF;
      color: white;
      font-family: sans-serif;
      font-size: 1em;
      overflow: hidden;
      white-space: nowrap;
      z-index: 10;
    }

    #scrollText {
      display: inline-block;
      padding-left: 100%;
      animation: scrollText 20s linear infinite;
    }

    @keyframes scrollText {
      0% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(-100%);
      }
    }
  </style>
</head>
<body>
  <div id="videoContainer">
    <iframe
      id="videoFrame"
      src="https://www.livereacting.com/tools/mp4-player-embed?url=https%3A%2F%2Fcdn2.einthusan.io%2Fetv%2Fcontent%2FD7ret.mp4.m3u8%3Fe%3D1755861817%26md5%3DNFh4WL3rMuafA9t2mkGmXw"
      allowfullscreen
      allow="autoplay"
    ></iframe>

    <button id="muteButton">🔇</button>

    <div id="scrollBanner">
      <div id="scrollText"> Now Playing: "Special Movie" — Coming Up Next: "Another Title" </div>
    </div>
  </div>

  <script>
    const muteBtn = document.getElementById("muteButton");
    let isMuted = true;

    muteBtn.onclick = () => {
      isMuted = !isMuted;
      muteBtn.textContent = isMuted ? "🔇" : "🔊";
      // We can't mute/unmute iframe player directly due to cross-origin restrictions
      alert("Mute control is visual only due to iframe restrictions.");
    };
  </script>
</body>
</html>
