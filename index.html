<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Media Player</title>
    <!-- Link to your local shaka.js file in the same GitHub folder -->
    <script src="shaka.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #video-container, #iframe-container { width: 100%; height: 100%; display: none; }
        video, iframe { width: 100%; height: 100%; border: none; }
        
        /* Simple Channel Switcher Overlay (Optional) */
        .controls { position: absolute; bottom: 10px; left: 10px; z-index: 100; display: flex; gap: 5px; opacity: 0.5; transition: 0.3s; }
        .controls:hover { opacity: 1; }
        .btn { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 12px; cursor: pointer; font-size: 12px; border-radius: 4px; }
        .btn:hover { background: #e91e63; }
    </style>
</head>
<body>

    <!-- UI Overlay for your specific links -->
    <div class="controls">
        <button class="btn" onclick="window.location.search='?ch=1'">Bollywood Classic</button>
        <button class="btn" onclick="window.location.search='?ch=2'">Star Sports (Web)</button>
        <button class="btn" onclick="window.location.search='?ch=3'">Zee TV (DASH)</button>
    </div>

    <!-- Container 1: Shaka Player (HLS/DASH) -->
    <div id="video-container">
        <video id="video" controls autoplay muted playsinline></video>
    </div>

    <!-- Container 2: iFrame (PHP/Web pages) -->
    <div id="iframe-container">
        <iframe id="external-player" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <script>
    
            // In your player.html, update the channels object to point to your Worker
const channels = {
    "1": "/play/ch1", // This hides the real CloudFront URL
    "2": "/play/ch2", 
    "3": "/play/ch3"
};

// The rest of the Shaka code remains the same

                    
            async function initApp() {
            const params = new URLSearchParams(window.location.search);
            const channelId = params.get('ch') || "1"; // Default to Bollywood
            const customUrl = params.get('url'); // Or allow any custom URL via ?url=
            
            const targetUrl = customUrl || channels[channelId];
            
            const videoContainer = document.getElementById('video-container');
            const iframeContainer = document.getElementById('iframe-container');

            // Logic: Is it a direct stream or a webpage?
            if (targetUrl.includes('.m3u8') || targetUrl.includes('.mpd') || targetUrl.includes('.ts')) {
                videoContainer.style.display = 'block';
                await launchShaka(targetUrl);
            } else {
                iframeContainer.style.display = 'block';
                document.getElementById('external-player').src = targetUrl;
            }
        }

        async function launchShaka(url) {
            shaka.polyfill.installAll();
            const video = document.getElementById('video');
            const player = new shaka.Player(video);

            try {
                await player.load(url);
                console.log('Stream loaded!');
            } catch (e) {
                console.error('Shaka Player Error:', e.code);
                // Fallback: If Shaka fails, try loading in iframe as last resort
                document.getElementById('video-container').style.display = 'none';
                document.getElementById('iframe-container').style.display = 'block';
                document.getElementById('external-player').src = url;
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
