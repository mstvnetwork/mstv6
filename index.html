<!DOCTYPE html>
<html>
<head><title>Native Test</title></head>
<body style="background:#000; color:#0f0; text-align:center; font-family:sans-serif;">
    <h2>Native Video Test</h2>
    <!-- This is a direct MP4 link (No DASH, No DRM) -->
    <video controls autoplay width="100%" src="https://www.w3schools.com"></video>
    <div id="res" style="margin-top:20px;">CHECKING VIDEO ACCESS...</div>
</body>
<script>
    const v = document.querySelector('video');
    v.onplay = () => document.getElementById('res').innerText = "SUCCESS: YOU CAN WATCH VIDEO!";
    v.onerror = () => document.getElementById('res').innerText = "FAILURE: ISP BLOCKED VIDEO DATA!";
</script>
</html>
