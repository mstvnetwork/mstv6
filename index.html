<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Now HD - Mobile Data Fix</title>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #0f0; font-family: monospace; }
        .container { width: 90%; max-width: 800px; border: 1px solid #222; }
        video { width: 100%; height: auto; background: #111; }
        #status { margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <video id="video" controls autoplay crossorigin="anonymous"></video>
</div>
<div id="status">Connecting to Stream...</div>

<script>
const status = document.getElementById('status');
const video = document.getElementById('video');

// Try a different, faster proxy for Mobile Data [Source: corsproxy.io]
const proxy = 'https://corsproxy.io?';
const rawStream = 'https://times-ott-live.akamaized.net';
const manifestUri = proxy + encodeURIComponent(rawStream);

const shakaLib = 'https://cdnjs.cloudflare.com';

const clearKeyId = '40f019b86241d23ef075633fd7f1e927';
const clearKeyValue = '058dec845bd340178a388edd104a015e';

async function start() {
    try {
        status.innerText = "Loading Decryption Engine...";
        
        // Injecting script via Proxy to bypass Mobile Data blocking
        const scriptResponse = await fetch(proxy + encodeURIComponent(shakaLib));
        const scriptContent = await scriptResponse.text();
        const scriptTag = document.createElement('script');
        scriptTag.textContent = scriptContent;
        document.head.appendChild(scriptTag);

        // Wait a split second for the browser to register 'shaka'
        setTimeout(initPlayer, 500);
    } catch (e) {
        status.innerText = "Connection Blocked by Carrier. Please use a VPN.";
        status.style.color = "red";
    }
}

async function initPlayer() {
    if (typeof shaka === 'undefined') {
        status.innerText = "Error: Library Init Failed.";
        return;
    }

    const player = new shaka.Player(video);

    player.configure({
        drm: {
            clearKeys: { [clearKeyId]: clearKeyValue }
        }
    });

    player.addEventListener('error', (event) => {
        status.innerText = "Stream Error: " + event.detail.code;
    });

    try {
        await player.load(manifestUri);
        status.innerText = "LIVE: MOVIES NOW HD";
    } catch (e) {
        status.innerText = "Load Failed. Carrier may be blocking Akamai.";
        console.error(e);
    }
}

start();
</script>
</body>
</html>
