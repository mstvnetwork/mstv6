<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Now HD - Final Bypass</title>
    <!-- We load the player from a different, less-blocked source (Bitmovin CDN) -->
    <script src="https://cdn.bitmovin.com"></script>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #00ff00; font-family: sans-serif; text-align: center; }
        .container { width: 95%; max-width: 800px; border: 1px solid #333; }
        #player { width: 100%; aspect-ratio: 16/9; background: #111; }
        #status { margin-top: 15px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <div id="player"></div>
</div>
<div id="status">Bypassing Network Restrictions...</div>

<script>
const status = document.getElementById('status');

// Stream & DRM Keys
const manifestUrl = 'https://times-ott-live.akamaized.net';
const keyId = '40f019b86241d23ef075633fd7f1e927';
const keyVal = '058dec845bd340178a388edd104a015e';

// Using Bitmovin Player as it often handles ISP redirects better than Shaka
const config = {
  key: 'YOUR_FREE_BITMOVIN_KEY_OR_TRIAL', // Bitmovin needs a key, but we will try a generic DASH config
  source: {
    dash: manifestUrl,
    drm: {
      clearkey: [{
        keyId: keyId,
        key: keyVal
      }]
    }
  },
  playback: { autoplay: true, muted: true }
};

// Fallback to a super-simple DASH.js load if Bitmovin fails
function loadSimple() {
    const s = document.createElement('script');
    s.src = "https://cdn.dashjs.org";
    s.onload = () => {
        const player = dashjs.MediaPlayer().create();
        player.setProtectionData({
            "org.w3.clearkey": {
                "clearkeys": { [keyId]: keyVal }
            }
        });
        player.initialize(document.querySelector("#player"), manifestUrl, true);
        status.innerText = "STREAMING (DASH.JS MODE)";
    };
    document.head.appendChild(s);
}

// Check if we can reach the manifest
fetch('https://api.allorigins.win' + encodeURIComponent(manifestUrl))
    .then(r => {
        if(r.ok) {
            status.innerText = "Manifest Reachable. Starting Player...";
            loadSimple();
        } else {
            status.innerText = "Carrier Blocked the Stream (403/404).";
        }
    })
    .catch(() => {
        status.innerText = "Network Error: Proxy Blocked.";
    });

</script>
</body>
</html>
