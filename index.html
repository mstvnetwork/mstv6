<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTV Player Pro</title>
    <script src="shaka.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #video-container, #iframe-container { width: 100%; height: 100vh; display: none; }
        video, iframe { width: 100%; height: 100%; border: none; }
        
        /* Navigation Buttons */
        .nav { position: absolute; top: 15px; left: 15px; z-index: 100; display: flex; gap: 8px; }
        .btn { background: rgba(30, 30, 30, 0.8); color: #fff; border: 1px solid #444; padding: 10px 15px; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #e91e63; border-color: #fff; }

        /* Loading Spinner */
        #loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50; display: flex; flex-direction: column; align-items: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255, 255, 255, 0.1); border-top: 5px solid #e91e63; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .load-text { color: white; margin-top: 15px; font-size: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <div class="load-text">FETCHING STREAM...</div>
    </div>

    <div class="nav">
        <button class="btn" onclick="loadChannel('1')">Bollywood</button>
        <button class="btn" onclick="loadChannel('2')">Star Sports</button>
        <button class="btn" onclick="loadChannel('3')">Zee TV</button>
    </div>

    <div id="video-container">
        <video id="video" controls autoplay playsinline muted></video>
    </div>

    <div id="iframe-container">
        <iframe id="external-player" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

// ... (Keep your CSS and HTML from previous response) ...

<script>
    const workerBase = "https://my-proxy.mchoudhry482.workers.dev";
    let player;

    async function initApp() {
        shaka.polyfill.installAll();
        const video = document.getElementById('video');
        player = new shaka.Player(video);
        // Add this inside your initApp function in index.html
player.getNetworkingEngine().registerRequestFilter((type, request) => {
    // If Shaka tries to fetch segments from Amazon, redirect them through your Worker
    if (type === shaka.net.NetworkingEngine.RequestType.SEGMENT && request.uris[0].includes('cloudfront.net')) {
        const originalUri = request.uris[0];
        const segmentPath = originalUri.split('/').slice(3).join('/');
        request.uris = [workerBase + "/play/ch3/" + segmentPath];
    }
});

// Ensure your DRM keys are still there
player.configure({
  drm: {
    clearKeys: {
      'ed068cf84f0640ccbc7c0e395c0a272e': 'bb722190f2bb446391020411a7d0828b'
    }
  }
});

video.advideovideovideovideo.addEventListener('playing', () => document.getElementById('loader').style.display = 'none');
        loadChannel('1');
    }

    async function loadChannel(id) {
        const loader = document.getElementById('loader');
        const videoContainer = document.getElementById('video-container');
        const iframeContainer = document.getElementById('iframe-container');
        const iframe = document.getElementById('external-player');
        const video = document.getElementById('video');

        loader.style.display = 'flex';
        videoContainer.style.display = 'none';
        iframeContainer.style.display = 'none';
        iframe.src = "";
        video.pause();

        if (id === '2') {
            // Masked URL through Worker
            iframeContainer.style.display = 'block';
            iframe.src = workerBase + "/play/ch2"; 
            iframe.onload = () => setTimeout(() => loader.style.display = 'none', 1500);
        } else {
            videoContainer.style.display = 'block';
            try {
                // Shaka Player handles HLS (ch1) and DASH (ch3) automatically
                await player.load(workerBase + "/play/ch" + id);
            } catch (e) {
                loader.style.display = 'none';
                console.error('Shaka Error:', e.code);
                alert("Error: " + e.code);
            }
        }
    }

    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
