<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <title>Ultimate Live Player</title>
    <script src="https://cdn.dashjs.org"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .player-box { width: 90%; max-aspect-ratio: 16/9; max-width: 900px; border: 2px solid #444; border-radius: 10px; overflow: hidden; background: #111; }
        video { width: 100%; display: block; }
        .controls { margin-top: 15px; width: 90%; max-width: 900px; display: flex; gap: 10px; }
        select { flex: 1; padding: 12px; background: #222; color: #fff; border: 1px solid #555; border-radius: 5px; cursor: pointer; }
        button { padding: 12px 20px; background: #e50914; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="player-box">
        <video id="videoPlayer" controls autoplay crossorigin="anonymous"></video>
    </div>

    <div class="controls">
        <select id="channel-select" onchange="loadChannel()">
            <!-- ZEE TV (Using the keys you just found) -->
            <option value="https://d1g8wgjurz8via.cloudfront.net" 
                    data-type="dash" 
                    data-keyid="ed068cf84f0640ccbc7c0e395c0a272e" 
                    data-key="bb722190f2bb446391020411a7d0828b">
                Zee TV HD (Direct)
            </option>
            
            <!-- ADD OTHER CHANNELS HERE -->
            <option value="https://tulnit.com" data-type="iframe">
                Sony TV (Iframe Backup)
            </option>
        </select>
        <button onclick="loadChannel()">🔄 Refresh</button>
    </div>

    <script>
        let dashPlayer;
        let hlsPlayer;

        function loadChannel() {
            const video = document.getElementById('videoPlayer');
            const selector = document.getElementById('channel-select');
            const opt = selector.options[selector.selectedIndex];
            
            const url = opt.value;
            const type = opt.getAttribute('data-type');
            const kid = opt.getAttribute('data-keyid');
            const key = opt.getAttribute('data-key');

            // Reset existing players
            if (dashPlayer) { dashPlayer.destroy(); dashPlayer = null; }
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
            video.src = "";

            if (type === "dash") {
                dashPlayer = dashjs.MediaPlayer().create();
                
                // Add your ClearKey Protection
                if (kid && key) {
                    const protData = { "org.w3.clearkey": { "clearkeys": {} } };
                    protData["org.w3.clearkey"]["clearkeys"][kid] = key;
                    dashPlayer.setProtectionData(protData);
                }

                dashPlayer.initialize(video, url, true);
            } 
            else if (type === "hls") {
                if (Hls.isSupported()) {
                    hlsPlayer = new Hls();
                    hlsPlayer.loadSource(url);
                    hlsPlayer.attachMedia(video);
                }
            }
        }

        window.onload = loadChannel;
    </script>
</body>
</html>
