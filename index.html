<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #container { width: 100%; height: 100%; max-width: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="container" data-shaka-player-container>
        <video autoplay id="video" data-shaka-player></video>
    </div>

    <script>
    async function init() {
        const video = document.getElementById('video');
        const ui = video['ui'];
        const controls = ui.getControls();
        const player = controls.getPlayer();

        // Configure Clearkey DRM with your specific Hex keys
        player.configure({
            drm: {
                clearKeys: {
                    'ed068cf84f0640ccbc7c0e395c0a272e': 'bb722190f2bb446391020411a7d0828b'
                }
            },
            streaming: {
                bufferingGoal: 30,
                rebufferingGoal: 15
            }
        });

        try {
            await player.load('https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/main.mpd?');
            console.log('ZeeTV Stream Loaded Successfully');
        } catch (e) {
            console.error('Playback Error:', e.code, e);
            if (e.code === 1001) alert("CORS Error: The server is blocking this domain.");
        }
    }

    document.addEventListener('shaka-ui-loaded', init);
    </script>
</body>
</html>
