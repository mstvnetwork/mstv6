<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MSTV Network | Unified Player</title>
    <!-- Pointing to your local shaka.js -->
    <script src="shaka.js"></script>
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #player-wrapper { position: relative; width: 90%; max-width: 900px; aspect-ratio: 16/9; background: #111; border: 2px solid #333; border-radius: 8px; overflow: hidden; }
        video { width: 100%; height: 100%; }
        #status { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; font-size: 12px; border-radius: 4px; }
        #error-display { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10; text-align: center; }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <div id="error-display">
            <h2 id="err-title">Playback Error</h2>
            <p id="err-msg"></p>
            <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer;">Retry</button>
        </div>
        <video id="video" controls autoplay crossorigin="anonymous"></video>
        <div id="status">Initializing...</div>
    </div>

    <script>
        // UPDATE THESE MANUALLY IF ZEE TV STOPS WORKING
        const manifestUri = 'https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/main.mpd';
        const keyId = 'ed068cf84f0640ccbc7c0e395c0a272e';
        const key = 'bb722190f2bb446391020411a7d0828b';

        async function initPlayer() {
            const status = document.getElementById('status');
            const video = document.getElementById('video');
            const errorDisplay = document.getElementById('error-display');

            if (typeof shaka === 'undefined') {
                status.innerText = "Error: shaka.js not found!";
                return;
            }

            shaka.polyfill.installAll();
            const player = new shaka.Player(video);

            // 1. DRM Configuration
            player.configure({
                drm: { clearKeys: { [keyId]: key } }
            });

            // 2. Networking Filter (The "Surity" Part)
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Origin'] = 'https://www.zee5.com';
                request.headers['Referer'] = 'https://www.zee5.com'; // Note the trailing slash
            });

            // 3. Error Handling
            player.addEventListener('error', (event) => {
                const err = event.detail;
                errorDisplay.style.display = 'flex';
                document.getElementById('err-msg').innerText = `Error Code: ${err.code}\n(Likely Expired Keys or 403 Forbidden)`;
                status.innerText = "Playback Failed.";
            });

            try {
                status.innerText = "Loading Zee TV...";
                await player.load(manifestUri);
                status.innerText = "Playing Live Stream";
            } catch (e) {
                // Handled by event listener
            }
        }

        document.addEventListener('DOMContentLoaded', initPlayer);
    </script>
</body>
</html>
