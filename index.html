<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeeTV HD - MSTV Network</title>
    <!-- Direct load from your repo to bypass ISP filter -->
    <script src="shaka.js"></script>
    <style>
        body { margin: 0; background: #000; color: #0f0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; overflow: hidden; }
        .player-container { width: 95%; max-width: 800px; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,255,0,0.1); background: #111; position: relative; }
        video { width: 100%; height: auto; display: block; }
        #status { margin-top: 20px; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); }
        .error { color: #ff4444; }
        .success { color: #00ff00; }
    </style>
</head>
<body>

<div class="player-container">
    <video id="video" controls autoplay crossorigin="anonymous"></video>
</div>
<div id="status">INITIATING SECURE HANDSHAKE...</div>

<script>
    const status = document.getElementById('status');
    const video = document.getElementById('video');

    // 1. YOUR VERIFIED CLOUDFLARE WORKER URL
    const myWorker = "https://my-proxy.mchoudhry482.workers.dev";
    
    // 2. FIXED ZEETV DATA (Full Path + Sniffed Keys)
    const rawManifest = 'https://d1g8wgjurz8via.cloudfront.net';
    const kid = 'ed068cf84f0640ccbc7c0e395c0a272e';
    const key = 'bb722190f2bb446391020411a7d0828b';

    function init() {
        status.innerText = "Checking Engine Activation...";
        
        // Wait for the <script src="shaka.js"> to be ready
        if (typeof shaka === 'undefined') {
            status.innerText = "ENGINE NOT READY. RETRYING...";
            setTimeout(init, 1000);
            return;
        }
        
        status.innerText = "ENGINE ACTIVE. CONNECTING TO TUNNEL...";
        startPlayer();
    }

       async function startPlayer() {
        const player = new shaka.Player(); // No video element in constructor
        await player.attach(video); // Modern attach method

        player.configure({
            drm: { clearKeys: { [kid]: key } },
            streaming: {
                bufferingGoal: 30,
                rebufferingGoal: 15,
                retryParameters: { maxAttempts: 5, baseDelay: 1000 }
            }
        });

        player.addEventListener('error', (event) => {
            status.innerText = "STREAM ERROR: " + event.detail.code;
            status.className = "error";
            if (event.detail.code === 4000) {
                status.innerText = "Error 4000: Worker failed to fetch segments.";
            }
        });

        try {
            // Note the use of /?url= to ensure the worker parses the query correctly
            const proxiedUrl = myWorker + "/?url=" + encodeURIComponent(rawManifest);
            await player.load(proxiedUrl);
            status.innerText = "LIVE: ZEE TV HD";
            status.className = "success";
        } catch (e) {
            status.innerText = "LOAD FAILED (CODE " + e.code + ")";
            status.className = "error";
        }
    }


    // Start the process
    window.onload = init;
</script>
</body>
</html>
