<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Now HD - Fixed Player</title>
    <!-- Use jsDelivr for more reliable script loading on GitHub Pages -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net">
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
        .container { width: 90%; max-width: 800px; }
        video { width: 100%; height: auto; background: #111; }
        #status { margin-top: 10px; color: #888; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container" data-shaka-player-container>
    <video id="video" data-shaka-player-video autoplay style="width:100%;height:100%"></video>
</div>
<div id="status">Initializing Player...</div>

<script>
// CORS Proxy is required because Akamai blocks mstvnetwork.github.io [Source: Cloudinary Docs]
const rawUri = 'https://times-ott-live.akamaized.net';
const manifestUri = 'https://cors-anywhere.herokuapp.com' + rawUri; // Try herokuapp if corsproxy.io is blocked

const clearKeyId = '40f019b86241d23ef075633fd7f1e927';
const clearKeyValue = '058dec845bd340178a388edd104a015e';

async function initPlayer() {
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    
    // Shaka UI handles player initialization automatically when data-shaka-player attributes are present
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    // Set ClearKey configuration [Source: Shaka Player Demo]
    player.configure({
        drm: {
            clearKeys: {
                [clearKeyId]: clearKeyValue
            }
        }
    });

    player.addEventListener('error', (event) => {
        status.innerText = 'Error: ' + event.detail.code;
        console.error('Shaka Error:', event.detail);
    });

    try {
        await player.load(manifestUri);
        status.innerText = 'Playing: Movies Now HD';
    } catch (e) {
        status.innerText = 'Load Failed (Check Console)';
        console.error('Load Error:', e);
    }
}

// Start when UI is ready
document.addEventListener('shaka-ui-loaded', initPlayer);
</script>

</body>
</html>
