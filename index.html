<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Zee TV HD - Netlify Edge Player</title>
    
    <!-- DASH.js Library -->
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

    <style>
        body { 
            background: #0b0b0b; color: #fff; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; min-height: 100vh; font-family: sans-serif; 
        }
        .player-container { 
            width: 95%; max-width: 900px; 
            background: #000; border: 2px solid #333; 
            border-radius: 12px; overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        video { width: 100%; display: block; aspect-ratio: 16/9; }
        .info-panel { padding: 20px; text-align: center; }
        .status-badge { 
            padding: 6px 15px; border-radius: 20px; 
            background: #e50914; font-size: 14px; font-weight: bold; 
            transition: background 0.5s ease;
        }
        .instructions { margin-top: 15px; color: #888; font-size: 13px; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- Autoplay requires 'muted' -->
        <video id="videoPlayer" controls autoplay muted playsinline crossorigin="anonymous"></video>
        <div class="info-panel">
            <span class="status-badge" id="status">CONNECTING VIA EDGE...</span>
            <div class="instructions">If audio is missing, click the player to Unmute.</div>
        </div>
    </div>

    <script>
        function initPlayer() {
            const video = document.querySelector("#videoPlayer");
            const status = document.querySelector("#status");
            
            // 1. FULL MANIFEST URL (Fixed path)
            const rawUrl = "https://d1g8wgjurz8via.cloudfront.net";
            
            // 2. NETLIFY EDGE PROXY: Points to your local /proxy function
            const proxiedUrl = "/proxy?url=" + encodeURIComponent(rawUrl);

            // 3. DRM KEYS: Decrypts the video track
            const protectionData = {
                "org.w3.clearkey": {
                    "clearkeys": {
                        "ed068cf84f0640ccbc7c0e395c0a272e": "bb722190f2bb446391020411a7d0828b"
                    }
                }
            };

            const player = dashjs.MediaPlayer().create();
            
            // Apply Protection (Keys)
            player.setProtectionData(protectionData);
            
            // Initialize Player with your Proxy
            player.initialize(video, proxiedUrl, true);

            // Success Event
            player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
                status.innerText = "LIVE - ZEE TV HD";
                status.style.background = "#008000";
            });

            // Error Event
            player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
                status.innerText = "STREAM ERROR - CHECK KEYS";
                console.error("Netlify Edge Error:", e);
            });
        }

        document.addEventListener("DOMContentLoaded", initPlayer);
    </script>
</body>
</html>
