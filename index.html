<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hides GitHub Referrer to help bypass 'Access Denied' -->
    <meta name="referrer" content="no-referrer">
    <title>Zee TV HD - Direct Test Player</title>
    
    <!-- Official DASH.js Library for encrypted streams -->
    <script src="https://cdn.dashjs.org"></script>

    <style>
        body { 
            background: #000; color: #fff; margin: 0; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; font-family: sans-serif; 
        }
        .player-container { 
            width: 90%; max-width: 900px; 
            background: #111; border: 2px solid #333; 
            border-radius: 12px; overflow: hidden; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }
        video { width: 100%; display: block; aspect-ratio: 16/9; }
        .status-bar { padding: 15px; background: #222; text-align: center; font-size: 14px; }
        .status-tag { color: #e50914; font-weight: bold; }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- 'muted' helps bypass browser autoplay blocks -->
        <video id="zeePlayer" controls autoplay muted crossorigin="anonymous"></video>
        <div class="status-bar">
            Status: <span id="status" class="status-tag">Initialising...</span>
        </div>
    </div>

    <script>
        // YOUR DATA
        const streamUrl = "https://d1g8wgjurz8via.cloudfront.net";
        const keyID = "ed068cf84f0640ccbc7c0e395c0a272e";
        const key = "bb722190f2bb446391020411a7d0828b";

        function startPlayer() {
            const video = document.querySelector("#zeePlayer");
            const status = document.querySelector("#status");
            const player = dashjs.MediaPlayer().create();

            // Setup Decryption Keys (ClearKey DRM)
            const protectionData = {
                "org.w3.clearkey": {
                    "clearkeys": {}
                }
            };
            protectionData["org.w3.clearkey"]["clearkeys"][keyID] = key;

            player.setProtectionData(protectionData);
            
            // Initialize Player
            player.initialize(video, streamUrl, true);

            player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
                status.innerText = "Playing (Zee TV HD)";
                status.style.color = "#00ff00";
            });

            player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
                status.innerText = "Error: Access Denied or Expired Key";
                status.style.color = "#ff0000";
                console.error("Dash Error:", e);
            });
        }

        window.onload = startPlayer;
    </script>
</body>
</html>
