<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MSTV Instant Switch Player</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    #spinner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 6px solid #f3f3f3;
      border-top: 6px solid gold;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      z-index: 9999;
    }
    @keyframes spin {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="spinner"></div>
  <iframe id="player" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <script>
    const player = document.getElementById("player");
    const spinner = document.getElementById("spinner");

    // Get channel param from URL (?ch=1)
    const urlParams = new URLSearchParams(window.location.search);
    const ch = urlParams.get("ch") || "1";
    const jsonUrl = `sync-ch${ch}.json`;

    let currentUrl = null;

    async function fetchChannel() {
      try {
        const res = await fetch(jsonUrl + "?_=" + Date.now()); // prevent cache
        const data = await res.json();

        // Get first video url from the JSON
        const newUrl = data.video_list[0].url;

        if (newUrl !== currentUrl) {
          currentUrl = newUrl;
          switchVideo(newUrl);
        }
      } catch (e) {
        console.error("Error fetching JSON:", e);
      }
    }

    function switchVideo(url) {
      spinner.style.display = "block";
      player.src = url;
      player.onload = () => {
        spinner.style.display = "none";
      };
    }

    // Initial load
    fetchChannel();

    // Poll every 2 seconds
    setInterval(fetchChannel, 2000);
  </script>
</body>
</html>
