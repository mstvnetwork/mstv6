<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Live Multi-Player (Bypass Mode)</title>
    
    <!-- 1. BYPASS SCRIPT: Helps load restricted iframes on GitHub Pages -->
    <script src="https://unpkg.com" type="module"></script>

    <style>
        body { background: #0b0b0b; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; }
        
        .controls { margin-bottom: 20px; display: flex; gap: 12px; align-items: center; z-index: 100; }
        select, button { padding: 12px 18px; font-size: 15px; background: #222; color: white; border: 1px solid #444; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #e50914; border-color: #e50914; }

        /* 2. PLAYER WINDOW: Fixed 16:9 shape to prevent 'tube' shrinking */
        .player-window {
            width: 90%;
            max-width: 900px;
            aspect-ratio: 16 / 9; 
            overflow: hidden; 
            position: relative;
            border: 3px solid #333; 
            background: #000;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }

        /* 3. ZOOM & CROP: Adjusts the source page to focus on the video */
        #main-iframe {
            position: absolute;
            width: 180%; /* Zoomed width */
            height: 350%; /* Zoomed height */
            border: none;
            transition: opacity 0.3s ease;
        }

        .hint { margin-top: 15px; color: #888; font-size: 13px; }
    </style>
</head>
<body>

    <div class="controls">
        <select id="channel-select" onchange="updatePlayer()">
            <!-- Custom data-top/left for each specific channel layout -->
            <option value="https://tulnit.com/live/sony-tv-hd/" data-top="-380" data-left="-150">Sony TV HD</option>
            <option value="https://tulnit.com/live/bollywood-plus/" data-top="-380" data-left="-150">Star Plus</option>
            <option value="https://tulnit.com" data-top="-380" data-left="-150">Colors TV</option>
        </select>

        <button onclick="updatePlayer()">🔄 Reset Player</button>
    </div>

    <div class="player-window">
        <!-- 4. IS="X-FRAME-BYPASS": Triggers the proxy script -->
        <iframe id="main-iframe" is="x-frame-bypass" src="about:blank" scrolling="no" frameborder="0"></iframe>
    </div>

    <p class="hint">Note: You must manually click the <b>Play</b> button inside the frame to start audio.</p>

    <script>
        function updatePlayer() {
            const selector = document.getElementById('channel-select');
            const iframe = document.getElementById('main-iframe');
            
            const selectedOption = selector.options[selector.selectedIndex];
            const newSrc = selectedOption.value;
            const newTop = selectedOption.getAttribute('data-top');
            const newLeft = selectedOption.getAttribute('data-left');

            // Set opacity to 0 during reload for smoother transition
            iframe.style.opacity = "0";
            iframe.src = "about:blank";
            
            setTimeout(() => {
                iframe.src = newSrc;
                iframe.style.top = newTop + "px";
                iframe.style.left = newLeft + "px";
                iframe.style.opacity = "1";
            }, 50);
        }

        // Run on start
        window.onload = updatePlayer;
    </script>

</body>
</html>
