<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Now HD - Live</title>
    <!-- Corrected Shaka Player UI Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
    <!-- Corrected Shaka Player UI Library -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .container { width: 90%; max-width: 800px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        video { width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="container" data-shaka-player-container>
    <video id="video" data-shaka-player-video autoplay style="width:100%;height:100%"></video>
</div>

<script>
// Using a CORS Proxy to prevent the 'Allow-Origin' block from Akamai
const rawUri = 'https://times-ott-live.akamaized.net';
const manifestUri = 'https://corsproxy.io?' + encodeURIComponent(rawUri);

const clearKeyId = '40f019b86241d23ef075633fd7f1e927';
const clearKeyValue = '058dec845bd340178a388edd104a015e';

async function initApp() {
    shaka.polyfill.installAll();
    if (shaka.Player.isBrowserSupported()) {
        initPlayer();
    } else {
        console.error('Browser not supported for Shaka Player!');
    }
}

async function initPlayer() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    
    // Get the player instance from the UI
    const player = ui.getControls().getPlayer();

    // ClearKey DRM Configuration
    player.configure({
        drm: {
            clearKeys: {
                [clearKeyId]: clearKeyValue
            }
        }
    });

    player.addEventListener('error', (event) => {
        console.error('Shaka Player Error:', event.detail);
    });

    try {
        await player.load(manifestUri);
        console.log('Stream loaded successfully!');
    } catch (e) {
        console.error('Load Error:', e.code, e);
    }
}

// Ensure the UI loads before starting
document.addEventListener('shaka-ui-loaded', initApp);
</script>

</body>
</html>
