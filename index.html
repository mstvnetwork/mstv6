<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTV Network | Unified Player</title>
    <!-- Your local library -->
    <script src="shaka.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; color: white; }
        #app-container { display: flex; width: 100vw; height: 100vh; }
        
        /* Sidebar Styles */
        #sidebar { width: 220px; background: #111; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .brand { padding: 20px; font-weight: bold; color: #007bff; border-bottom: 1px solid #333; text-align: center; }
        .channel-list { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .btn { width: 100%; padding: 12px; margin-bottom: 8px; background: #222; border: 1px solid #444; color: #ccc; border-radius: 4px; cursor: pointer; text-align: left; transition: 0.2s; }
        .btn:hover { background: #333; color: white; }
        .btn.active { background: #007bff; color: white; border-color: #0056b3; }

        /* Player Stage Styles */
        #stage { flex-grow: 1; position: relative; background: #000; display: flex; justify-content: center; align-items: center; }
        video, iframe { width: 100%; height: 100%; border: none; display: none; }
        
        /* Error/Status Overlay */
        #overlay { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; font-size: 10px; border-radius: 4px; pointer-events: none; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="sidebar">
        <div class="brand">MSTV NETWORK</div>
        <div class="channel-list" id="channel-list">
            <!-- Buttons generated by JS -->
        </div>
    </div>

    <div id="stage">
        <div id="overlay">System Ready</div>
        <!-- Shaka Player Video Element -->
        <video id="video" controls autoplay crossorigin="anonymous"></video>
        <!-- External Iframe Element -->
        <iframe id="external-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>
</div>
<script>
    // --- DATABASE ---
    const channels = [
        {
            name: "Zee TV (Encrypted)",
            url: "https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/main.mpd",
            type: "shaka",
            clearKey: { 'ed068cf84f0640ccbc7c0e395c0a272e': 'bb722190f2bb446391020411a7d0828b' }
        },
        {
            name: "Bollywood Classic",
            url: "https://d35j504z0x2vu2.cloudfront.net",
            type: "shaka",
            clearKey: null 
        },
        {
            name: "Star Sports (External)",
            url: "https://streamcrichd.com",
            type: "iframe"
        }
    ];

    let player;
    const video = document.getElementById('video');
    const iframe = document.getElementById('external-frame');
    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');

    async function init() {
        // 1. AUTO-HIDE SIDEBAR IF EMBEDDED
        if (window.self !== window.top) {
            sidebar.style.display = 'none'; // Hides the channel list automatically
            overlay.style.display = 'none'; // Optional: hide status overlay too
        }

        if (typeof shaka === 'undefined') {
            overlay.innerText = "Error: shaka.js not found!";
            return;
        }

        shaka.polyfill.installAll();
        player = new shaka.Player(video);

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['Origin'] = 'https://www.zee5.com';
            request.headers['Referer'] = 'https://www.zee5.com';
        });

        renderButtons();
        
        // 2. LOAD CHANNEL FROM URL PARAMETER (Optional but recommended)
        // Usage: https://yourpage.io
        const urlParams = new URLSearchParams(window.location.search);
        const chIndex = parseInt(urlParams.get('ch')) || 0;
        loadChannel(chIndex);
    }

    // ... (rest of renderButtons and loadChannel functions from previous code)
</script>
</body>
</html>
