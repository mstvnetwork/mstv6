<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Now HD - Final Fix</title>
    <!-- Using Unpkg instead of Cloudflare to bypass ISP blocks -->
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #0f0; font-family: sans-serif; }
        .container { width: 95%; max-width: 800px; border: 1px solid #333; }
        video { width: 100%; height: auto; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <video id="video" controls autoplay crossorigin="anonymous"></video>
</div>
<div id="status">Connecting...</div>

<script>
const status = document.getElementById('status');
const video = document.getElementById('video');

// Use AllOrigins as a fallback proxy for the manifest only
const rawStream = 'https://times-ott-live.akamaized.net';
const manifestUri = 'https://api.allorigins.win' + encodeURIComponent(rawStream);

const clearKeyId = '40f019b86241d23ef075633fd7f1e927';
const clearKeyValue = '058dec845bd340178a388edd104a015e';

function init() {
    // Check if the script at the top actually loaded
    if (typeof shaka === 'undefined') {
        status.innerText = "CDN Blocked. Trying secondary load...";
        loadFallback();
        return;
    }
    
    startPlayer();
}

async function startPlayer() {
    const player = new shaka.Player(video);

    player.configure({
        drm: {
            clearKeys: { [clearKeyId]: clearKeyValue }
        }
    });

    player.addEventListener('error', (event) => {
        status.innerText = "Error: " + event.detail.code;
        console.error('Shaka Error:', event.detail);
    });

    try {
        await player.load(manifestUri);
        status.innerText = "STREAMING: MOVIES NOW HD";
    } catch (e) {
        status.innerText = "Load Failed (Error " + e.code + ")";
    }
}

// Fallback if Unpkg is blocked
function loadFallback() {
    const s = document.createElement('script');
    s.src = "https://cdn.jsdelivr.net";
    s.onload = startPlayer;
    document.head.appendChild(s);
}

// Run init after a short delay
setTimeout(init, 1000);
</script>
</body>
</html>
