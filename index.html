<!DOCTYPE html>
<html>
<head>
    <title>Zee TV HD Proxy</title>
    <!-- Use a reliable, direct CDN link -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        #videoPlayer { width: 90%; max-width: 800px; aspect-ratio: 16/9; background: #111; }
        #status { margin-top: 15px; font-weight: bold; color: #ff9800; }
    </style>
</head>
<body>
    <video id="videoPlayer" controls autoplay muted playsinline></video>
    <div id="status">CHECKING PROXY...</div>

    <script>
        window.onload = function() {
            const video = document.querySelector("#videoPlayer");
            const status = document.querySelector("#status");
            
            // The Proxy URL
            const manifestUrl = "/proxy-stream/bpk-tv/Zeetv/default/main.mpd";

            if (typeof dashjs === "undefined") {
                status.innerText = "ERROR: DASH.JS LIBRARY BLOCKED (CORB/CSP)";
                status.style.color = "red";
                return;
            }

            const player = dashjs.MediaPlayer().create();
            
            // ClearKey DRM
            player.setProtectionData({
                "org.w3.clearkey": {
                    "clearkeys": {
                        "ed068cf84f0640ccbc7c0e395c0a272e": "bb722190f2bb446391020411a7d0828b"
                    }
                }
            });

            player.initialize(video, manifestUrl, true);

            player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, () => {
                status.innerText = "LIVE: ZEE TV HD";
                status.style.color = "lime";
            });

            player.on(dashjs.MediaPlayer.events.ERROR, (e) => {
                status.innerText = "STREAM ERROR: CHECK CONSOLE";
                console.error("Dash Error:", e);
            });
        };
    </script>
</body>
</html>
