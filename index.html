<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Zee TV HD - Netlify Fix</title>
    
    <!-- Load Dash.js Library First -->
    <script src="https://cdn.dashjs.org"></script>

    <style>
        body { background: #000; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .player-container { width: 95%; max-width: 850px; border: 2px solid #333; border-radius: 10px; overflow: hidden; background: #000; }
        video { width: 100%; aspect-ratio: 16/9; display: block; }
        .status { padding: 15px; text-align: center; font-size: 14px; background: #111; color: #e50914; font-weight: bold; }
    </style>
</head>
<body>

    <div class="player-container">
        <video id="videoPlayer" controls autoplay muted playsinline crossorigin="anonymous"></video>
        <div class="status" id="status">CONNECTING TO EDGE PROXY...</div>
    </div>

    <script>
        function initPlayer() {
            const video = document.querySelector("#videoPlayer");
            const statusBox = document.querySelector("#status");
            
            // 1. YOUR CURL URL (Include the ?)
            const rawUrl = "https://d1g8wgjurz8via.cloudfront.net?";
            
            // 2. YOUR NETLIFY PROXY
            const proxiedUrl = "/proxy?url=" + encodeURIComponent(rawUrl);

            // 3. CREATE THE PLAYER
            const player = dashjs.MediaPlayer().create();

            // 4. APPLY KEYS (Fixed the 'player is not defined' error)
            const protectionData = {
                "org.w3.clearkey": {
                    "clearkeys": {
                        "ed068cf84f0640ccbc7c0e395c0a272e": "bb722190f2bb446391020411a7d0828b"
                    }
                }
            };

            player.setProtectionData(protectionData);
            
            // 5. START
            player.initialize(video, proxiedUrl, true);

            player.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function() {
                statusBox.innerText = "LIVE - ZEE TV HD";
                statusBox.style.color = "#00ff00";
            });

            player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
                statusBox.innerText = "STREAM ERROR: CHECK PROXY LOGS";
                console.error("Dash Error:", e);
            });
        }

        // Initialize when the page is ready
        document.addEventListener("DOMContentLoaded", initPlayer);
    </script>
</body>
</html>
