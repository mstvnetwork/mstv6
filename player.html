<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shaka Debugger | Local Lib Test</title>
    
    <!-- 1. POINT TO YOUR LOCAL FILE -->
    <script src="shaka.js"></script>

    <style>
        body { margin: 0; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; }
        #player-container { position: relative; width: 80%; max-width: 900px; border: 2px solid #444; border-radius: 8px; overflow: hidden; background: #000; }
        video { width: 100%; display: block; }
        #error-box { position: absolute; top: 10%; left: 10%; right: 10%; background: rgba(220, 53, 69, 0.95); padding: 20px; border-radius: 5px; display: none; z-index: 100; border-left: 5px solid white; }
        .log-panel { margin-top: 15px; width: 80%; max-width: 900px; font-family: monospace; font-size: 12px; color: #888; background: #1a1a1a; padding: 10px; border-radius: 4px; height: 100px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="player-container">
        <div id="error-box">
            <h3 style="margin:0 0 10px 0;">Playback Blocked</h3>
            <p id="err-desc" style="margin:0; font-size: 14px;"></p>
            <p id="err-code" style="margin-top:10px; font-weight:bold; opacity: 0.8;"></p>
        </div>
        <video id="video" controls autoplay crossorigin="anonymous"></video>
    </div>

    <div class="log-panel" id="logger">System initialized...</div>

    <script>
        // --- CONSTANTS ---
        const manifestUri = 'https://d1g8wgjurz8via.cloudfront.net/bpk-tv/Zeetv/default/main.mpd';
        const keyId = 'ed068cf84f0640ccbc7c0e395c0a272e';
        const key = 'bb722190f2bb446391020411a7d0828b';

        function log(msg) {
            const l = document.getElementById('logger');
            l.innerHTML += `<br>> ${msg}`;
            l.scrollTop = l.scrollHeight;
        }

        async function startPlayer() {
            // 1. Check if shaka.js is correctly loaded
            if (typeof shaka === 'undefined') {
                log("<span style='color:red'>ERROR: 'shaka' object not found. Ensure shaka.js is in the same folder!</span>");
                alert("Library Error: shaka.js failed to load. Check file path.");
                return;
            }

            log("Shaka Library detected. Version: " + shaka.Player.version);
            shaka.polyfill.installAll();

            const video = document.getElementById('video');
            const player = new shaka.Player(video);
            const errorBox = document.getElementById('error-box');

            // 2. ClearKey Config
            player.configure({
                drm: { clearKeys: { [keyId]: key } }
            });

            // 3. Network "Surity" Filter
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Origin'] = 'https://www.zee5.com';
                request.headers['Referer'] = 'https://www.zee5.com';
            });

            // 4. Error Handler
            player.addEventListener('error', (event) => {
                const err = event.detail;
                errorBox.style.display = 'block';
                document.getElementById('err-code').innerText = `Error Code: ${err.code}`;
                
                if (err.code === 1001) document.getElementById('err-desc').innerText = "CloudFront 403 Forbidden. The server is rejecting the request.";
                else if (err.code === 6007) document.getElementById('err-desc').innerText = "DRM Key mismatch or expired. The video is encrypted but the key failed.";
                else document.getElementById('err-desc').innerText = "A network or decoding error occurred.";
                
                log(`Shaka Error ${err.code} triggered.`);
            });

            // 5. Execution
            try {
                log("Attempting to load ZeeTV manifest...");
                await player.load(manifestUri);
                log("<span style='color:lime'>Success! Streaming started.</span>");
            } catch (e) {
                // Caught by event listener
            }
        }

        // Delay execution slightly to ensure shaka.js is parsed
        window.onload = () => {
            setTimeout(startPlayer, 100);
        };
    </script>
</body>
</html>
